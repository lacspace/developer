name: Refresh hub

# Weekly rebuild so new @lacspace/* releases flow into this site even without a
# code push. (Pushing to main also auto-deploys via the Vercel git integration.)
# VERCEL_DEPLOY_HOOK is a deploy hook on the lacspace-developer-platform project
# (team lacspace1): it can only trigger a production build of main.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a fresh production build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"
